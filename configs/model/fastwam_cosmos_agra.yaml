_target_: fastwam.models.cosmos.runtime.create_fastwam_cosmos

# Cosmos-Predict2.5-2B base/pre-trained EMA checkpoint (overridden by the sbatch).
video_dit_pretrained_path: /data/user/jhe724/workspace/weights/Cosmos-Predict2.5-2B/base/pre-trained/d20b7120-df3e-4911-919d-db6e08bad31c_ema_bf16.pt

action_dim: ${data.train.processor.action_output_dim}
proprio_dim: ${data.train.processor.proprio_output_dim}   # REQUIRED for AGRA (prepended s0 token)
crossattn_dim: 1024        # MiniTrainDIT crossattn_emb_channels (Qwen 3584 -> 1024 via model text_proj)

# AGRA world<->action cross-attention coupling ("Making Foresight Actionable",
# arXiv 2606.12217), cross-attn architecture only (NOT the AGRA alignment loss yet).
# The video DiT (28 blocks) is run twice: once at random tau_v for the video loss,
# once at FIXED tau_v=1 (o0-conditioned) to extract the 8-layer foresight that the
# standalone action head cross-attends to.
coupling: agra
mot_bidirectional: false   # unused for agra
feature_layer: -1          # unused for agra (multi-layer bridge is fixed: {0,4,8,12,15,19,23,27})
atten_backend: torch
train_video_expert: true

# AGRA action head. "gr00t" = the REAL GR00T-N1.7 flow-matching action DiT (32-layer
# interleaved -> 16 cross blocks, inner 1536, cross-attn 2048), initialised from the
# pretrained action_head.model.* weights (the paper's "employ the action DiT from
# GR00T-N1"); its 16 cross blocks read the 16-layer Cosmos foresight bridge. State/action
# use fresh LIBERO-dim Linears + FastWAM's own normalisation. "foresight" = the
# standalone reimpl (agra_num_layers/hidden/num_heads below apply only to it).
agra_head: gr00t
gr00t_action_dit_ckpt: /data/users/junjie/weights/gr00t_n1d7_action_dit.pt
action_horizon: null       # K (chunk length); informational only — the head is length-agnostic
                           # (LIBERO uses K=32: action_video_freq_ratio 4 x 8 video latents)
agra_num_layers: 8         # (foresight head only)
agra_hidden: 1024          # (foresight head only)
agra_num_heads: 32         # (foresight head only)
agra_crossattn_dim: 2048   # foresight cross-attn dim (= GR00T backbone_embedding_dim)

vae:
  vae_pth: /data/user/jhe724/workspace/weights/Cosmos-Predict2.5-2B/tokenizer.pth

video_scheduler:
  train_shift: 3.0          # Cosmos rectified-flow shift
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 3.0          # NOTE: paper samples tau_a from a Beta dist; we keep the
  num_train_timesteps: 1000 # existing flow-match scheduler sampling for now (TODO).
loss:
  lambda_video: 1.0
  lambda_action: 1.0
