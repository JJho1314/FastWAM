_target_: fastwam.runtime.create_fastwam_trimodal
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

# Text expert config. `vocab_size`, `max_seq_len`, num_heads/attn_head_dim/num_layers,
# and text_dim/freq_dim/eps are overridden by the factory from video/tokenizer.
text_dit_config:
  hidden_dim: 1024
  ffn_dim: 4096

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

text_scheduler:
  train_shift: 1.0
  num_train_timesteps: 1000
  mask_token_id: null  # null => uniform source; set an int to use mask token

loss:
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_text: 0.1
  # (time_v, time_a, time_t) text-timestep sampling mix.
  # - clean:  text presented as ground truth (time_t=0), CE loss skipped
  #           (helps train t2v / t2a without text noise)
  # - recall: text fully/partially noised, model must recall it from v/a
  #           (this is the Uni-ViGU "knowledge recall" signal)
  # - joint:  text noise sampled like recall but loss kept (joint denoising)
  text_clean_prob: 0.4
  text_recall_prob: 0.4
  text_joint_prob: 0.2
