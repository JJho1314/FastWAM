_target_: fastwam.runtime.create_fastwam_sana

sana_repo_path: /data/LFT-W02_data/junjie/VLA_WM/Sana
video_dit_pretrained_path: /data/LFT-W02_data/junjie/weights/SANA-Video_2B_480p/checkpoints/SANA_Video_2B_480p.pth

action_dim: ${data.train.processor.action_output_dim}
proprio_dim: ${data.train.processor.proprio_output_dim}
text_dim: 2304
feature_layer: -1
train_video_expert: true
detach_video_feats: false
grad_checkpointing: true

video_dit:
  model_name: SanaMSVideo_2000M_P2_D20
  in_channels: 16
  caption_channels: 2304
  model_max_length: 300
  attn_type: LiteLAReLURope
  ffn_type: GLUMBConvTemp
  mlp_ratio: 3
  mlp_acts: [silu, silu, null]
  linear_head_dim: 112
  use_pe: true
  pos_embed_type: wan_rope
  qk_norm: true
  cross_norm: true
  y_norm: true
  y_norm_scale_factor: 0.01
  class_dropout_prob: 0.0
  t_kernel_size: 3

action_dit:
  hidden_size: 1024
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  max_action_len: 64

vae:
  z_dim: 16
  vae_pth: /data/LFT-W02_data/junjie/weights/SANA-Video_2B_480p/vae/Wan2.1_VAE.pth

video_scheduler:
  train_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
