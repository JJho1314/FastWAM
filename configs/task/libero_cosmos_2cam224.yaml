# @package _global_

defaults:
  - override /data: libero_2cam_cosmos
  - override /model: fastwam_cosmos
  - _self_

# dataloading — 128 global batch = 2 (per-GPU) x 8 GPUs x 8 (grad accum)
batch_size: 2
num_workers: 8

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 5e-5      # conservative for the ~4B MoT model
num_epochs: 10
max_steps: null
log_every: 10
save_every: 1000
eval_every: 999999999    # eval disabled (no Cosmos infer path wired yet)

# training
gradient_accumulation_steps: 8
weight_decay: 1e-2
mixed_precision: bf16
resume: null
