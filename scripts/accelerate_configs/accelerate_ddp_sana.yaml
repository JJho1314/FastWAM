# Plain DDP (no DeepSpeed). The SANA kernels hit a CUDA 'misaligned address'
# under DeepSpeed (any ZeRO stage) at per-GPU batch > 2, but are fine without
# DeepSpeed; DDP keeps full (unsharded) optimizer states, which fits since the
# 3.1B model uses only a fraction of the 80GB H100s.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
mixed_precision: bf16
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
use_cpu: false
