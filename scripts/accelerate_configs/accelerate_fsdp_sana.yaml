# FSDP — the parallelism SANA itself uses (its train script sets FSDP_* env vars).
# FULL_SHARD shards params+grads+optimizer across GPUs (like ZeRO-3) but via
# PyTorch-native FSDP, which the SANA kernels are tested with — so it avoids the
# DeepSpeed 'misaligned address' AND keeps per-GPU memory low (large batch OK).
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
# bf16 like the original FastWAM (model_dtype=bf16, on-the-fly VAE encode). fp32
# was a mistake: it ~doubled SANA's all-gather bytes (123->225ms fwd) and forced
# tiny batches for no real benefit. The only deviation from the original training
# recipe is FSDP itself (SANA + DeepSpeed misaligns at per-GPU batch > 2).
mixed_precision: bf16
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: SanaVideoMSBlock,DiTBlock
  # SHARD_GRAD_OP (=ZeRO-2): params resident (no per-layer forward all-gather),
  # only grad+optimizer sharded. Overridden by FSDP_SHARD env in the sbatch.
  fsdp_sharding_strategy: SHARD_GRAD_OP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
use_cpu: false
